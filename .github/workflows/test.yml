name: Run tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: "Run Tests"
        run: docker run -v "${{ github.workspace }}:/app" elixir:1.19.5-otp-28-alpine /bin/sh -c "cd /app && mix deps.get && mix test.ci"
      - name: "Check formatting"
        run: docker run -v "${{ github.workspace }}:/app" elixir:1.19.5-otp-28-alpine /bin/sh -c "cd /app && mix format --check-formatted"
